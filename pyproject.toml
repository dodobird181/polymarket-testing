[tool.poetry]
name = "Polymarket Live-testing"
version = "0.1.0"
description = "A program for live-testing polymarket strategies."
authors = ["Samuel Morris <dodobird181@gmail.com>"]
license = "The Unlicense"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12.3,<3.15"
streamlit = "^1.55.0"
streamlit-monaco = "^0.1.3"
restrictedpython = "^8.1"
requests = "^2.32.5"
py-clob-client = "^0.34.6"
dotenv = "^0.9.9"
matplotlib = "^3.10.8"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"