[tool.poetry]
package-mode = false


[project]
name = "polymarket-testing"
version = "0.1.0"
description = "Polymarket BTC 5-min up/down backtesting"
authors = [
    {name = "dodo"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pandas (>=3.0.1,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
