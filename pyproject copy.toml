[tool.poetry]
package-mode = false
python = "^3.11"


[tool.poetry.group.dev.dependencies]
ipykernel = "^7.2.0"

[project]
name = "polymarket-testing"
version = "0.1.0"
description = "Polymarket BTC 5-min up/down backtesting"
authors = [
    {name = "dodo"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pandas (<3)",
    "py-clob-client (>=0.34.6,<0.35.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "honcho (>=2.0.0,<3.0.0)",
    "streamlit (>=1.55.0,<2.0.0)",
    "streamlit-monaco (>=0.1.3,<0.2.0)",
    "restrictedpython (>=8.1,<9.0) ; python_version >= \"3.11\" and python_version < \"3.15\"",
    "overmind (>=0.1.31,<0.2.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
